name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p pcore

      - name: Build service
        run: |
          cargo build --release -p opensenses-service
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Copy-Item target/release/opensenses-service.exe src-tauri/bin/

      - name: Build installer
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSenses-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/opensenses-service.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Test
        run: cargo test -p pcore

      - name: Build kernel driver
        run: |
          sudo apt-get install -y linux-headers-$(uname -r)
          make -C driver KDIR=/lib/modules/$(uname -r)/build
          make -C driver KDIR=/lib/modules/$(uname -r)/build clean

      - name: Build service
        run: |
          cargo build --release -p opensenses-service
          mkdir -p src-tauri/bin
          cp target/release/opensenses-service src-tauri/bin/

      - name: Build packages
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSenses-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
